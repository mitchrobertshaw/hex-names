name: verify on Etherscan

# Publishes the source code of .hex's Ethereum contracts on etherscan.io, so anyone can read what
# they do. Runs when the verify-contracts branch is pushed. Needs the ETHERSCAN_API_KEY repository
# secret (a free key from etherscan.io). The contracts, with their constructor arguments, are listed
# in deploy/verify/ethereum-mainnet.txt, made from the mainnet deploy's step 2 record. It builds them
# exactly as the deploy did (same Foundry, compiler and libraries), then deploy/verify/etherscan.py
# sends Etherscan each contract's source files, as the compiler's own record lists them; Etherscan
# publishes the code only if it compiles to what's on the chain. Contracts already verified are
# skipped, so it's safe to run again.

on:
  push:
    branches: [verify-contracts]

permissions:
  contents: read

jobs:
  etherscan:
    name: Verify on Etherscan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Foundry
        # Foundry 1.9.0, the version the deploy used, checked against its SHA-256 (as in test.yml).
        env:
          FOUNDRY_VERSION: v1.9.0
          FOUNDRY_SHA256: 8d17599b42e3139f1a9c171be3798c4ed8e743ae17b84cc3435e57bf2a51ae99
        run: |
          curl -sSfL --retry 20 --retry-delay 15 --retry-max-time 600 --retry-all-errors -o foundry.tar.gz \
            "https://github.com/foundry-rs/foundry/releases/download/$FOUNDRY_VERSION/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          echo "$FOUNDRY_SHA256  foundry.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.foundry/bin"
          tar -xzf foundry.tar.gz -C "$HOME/.foundry/bin"
          rm foundry.tar.gz
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          "$HOME/.foundry/bin/forge" --version

      - name: Cache ENSv2 and its libraries
        uses: actions/cache@v4
        with:
          path: lib
          key: deps-${{ hashFiles('install-deps.sh', 'patches/**') }}

      - name: Install dependencies
        run: bash install-deps.sh

      - name: Build
        run: forge build

      - name: Verify
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          if [ -z "$ETHERSCAN_API_KEY" ]; then
            echo "::error::The ETHERSCAN_API_KEY repository secret is missing."
            exit 1
          fi
          failed=0
          while read -r address contract args; do
            case "$address" in '' | '#'*) continue ;; esac
            if ! python3 deploy/verify/etherscan.py "$address" "$contract" "$args" < /dev/null; then
              failed=$((failed + 1))
            fi
          done < deploy/verify/ethereum-mainnet.txt
          echo "$failed not verified"
          [ "$failed" -eq 0 ]
