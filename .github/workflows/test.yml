name: test

# Every push, on every branch. Pull requests show these results too, since checks follow the commit.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0 # the same as the deploy workflow

      - name: Cache ENSv2 and its libraries
        uses: actions/cache@v4
        with:
          path: lib
          key: deps-${{ hashFiles('install-deps.sh', 'patches/**') }}

      - name: Install dependencies
        run: bash install-deps.sh

      - name: Build
        run: forge build --sizes

      - name: Unit tests (both chains, with a stand-in bridge)
        run: forge test -vvv --no-match-path "test/fork/*"

      - name: Fork tests against live PulseChain and Ethereum
        run: forge test -vvv --match-path "test/fork/*"
        env:
          PULSECHAIN_RPC_URL: ${{ vars.PULSECHAIN_RPC_URL || 'https://rpc.pulsechain.com' }}
          ETHEREUM_RPC_URL: ${{ vars.ETHEREUM_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}

  bot:
    name: Bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - run: npm ci

      - name: Type check and tests
        run: npm test

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type check, tests and build
        run: npm run typecheck && npm test && npm run build
