<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HexNS: .hex names for PulseChain and Ethereum</title>
    <meta
      name="description"
      content="Hex Name Service (HexNS): one .hex name for your wallet on PulseChain and Ethereum. Swap your 0x… for yourname.hex. $10 a year covers both chains, paid in PLS, HEX or any token."
    />
    <meta name="theme-color" content="#fff9f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#130b18" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hexns.domains" />
    <meta property="og:site_name" content="HexNS" />
    <meta property="og:title" content="HexNS: .hex names for PulseChain and Ethereum" />
    <meta
      property="og:description"
      content="Swap your 0x… for yourname.hex. One name for your wallet on PulseChain and Ethereum, made for Hexicans."
    />
    <meta name="twitter:card" content="summary" />
    <!-- The HexNS mark, inline so the one-file copy of the site (npm run build:single) has it too. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23FFC400%22/%3E%3Cstop offset=%22.45%22 stop-color=%22%23FF6A1F%22/%3E%3Cstop offset=%221%22 stop-color=%22%23E5007A%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill=%22url(%23g)%22 fill-rule=%22evenodd%22 d=%22M32 3.5 56.7 17.75v28.5L32 60.5 7.3 46.25v-28.5zM32 20.5l-10.4 6v12L32 44.5l10.4-6v-12z%22/%3E%3C/svg%3E"
    />
    <script>
      // Use the visitor's saved light or dark choice before anything is drawn.
      try {
        var theme = localStorage.getItem("hexns-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
